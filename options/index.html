<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Keepit — إدارة المجموعات</title>
    <!--
      سكربت خارجي صغير لتقدير المظهر مبكرًا (انظر شرحه في الملف نفسه).
      يجب أن يكون خارجيًا: سياسة أمان المحتوى الافتراضية في Manifest V3
      تمنع تنفيذ أي سكربت مضمَّن داخل HTML مهما كان مصدره.
    -->
    <script src="../shared/theme-init.js"></script>
    <script src="../shared/dedup.js"></script>
    <script src="../shared/dir-switch.js"></script>
    <link rel="stylesheet" href="./main.css" />
    <link rel="stylesheet" href="./local-sync-panel.css" />
    <link rel="stylesheet" href="./trash-panel.css" />
    <link rel="stylesheet" href="./snapshots-panel.css" />
    <link rel="stylesheet" href="./bookmarks-panel.css" />
    <link rel="stylesheet" href="./item-manager-panel.css" />
    <link rel="stylesheet" href="../trash/undo-toast.css" />
    <link rel="stylesheet" href="../search-enhance/search-enhance.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="./main.js"></script>
    <script type="module" src="./local-sync-panel.js"></script>
    <!--
      سلة المحذوفات والنسخ الاحتياطية: كل منهما يُضيف زرًّا خاصًّا به في
      شريط أدوات الصفحة (انظر شرح كل ملف على حدة). لا تعديل على main.js.
    -->
    <script type="module" src="./trash-panel.js"></script>
    <script type="module" src="./snapshots-panel.js"></script>
    <script type="module" src="./bookmarks-panel.js"></script>
    <script type="module" src="./item-manager-panel.js"></script>
    <script type="module" src="../trash/undo-toast.js"></script>
    <!--
      البحث يشمل أسماء التصنيفات ومواقعها المحفوظة معًا (نفس الوحدة بالضبط
      المستخدمة في النافذة المنبثقة — راجع search-enhance/mount.js وstore.js).
    -->
    <script type="module" src="../search-enhance/index.js"></script>
  </body>
</html>
